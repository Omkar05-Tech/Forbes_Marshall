services:
  # 1. MongoDB Service (Change type to pserv)
  - type: pserv
    name: forbes-db
    runtime: docker
    image: mongo:latest
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 1

  # 2. FastAPI Backend
  - type: web
    name: forbes-backend
    runtime: docker
    dockerContext: ./Backend
    dockerfile: Dockerfile
    plan: free
    envVars:
      - key: MONGO_URI
        value: mongodb://forbes-db:27017/forbes_marshall_temp
      - key: GOOGLE_API_KEY
        sync: false 
      - key: DB_NAME
        value: forbes_marshall_temp
    healthCheckPath: /api/health # This requires the endpoint below

  # 3. React Frontend
  - type: web
    name: forbes-frontend
    runtime: docker
    dockerContext: ./Frontend
    dockerfile: Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: forbes-backend
          type: web
          property: url
