services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: forbes_marshall_db
    command: ["mongod", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: forbes_marshall_backend
    container_name: forbes_marshall_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Explicitly override MONGO_URI to use the container name
      - MONGO_URI=mongodb://mongodb:27017
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: forbes_marshall_frontend
    container_name: forbes_marshall_ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data: